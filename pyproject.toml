[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pt_br_accent_toolbox"
version = "0.1.0"
description = "Feature extraction and analysis tools for Brazilian Portuguese speech"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "torch",
    "transformers",
    "onnxruntime",
    "soundfile",
    "librosa",
    "lhotse",
    "speechbrain",
    "praat-parselmouth",
    "huggingface-hub",
    "xgboost",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu"]
datasets = ["pandas", "datasets", "kaggle", "pyannote.audio", "pyarrow", "fsspec"]

[project.scripts]
pt-br-accent-toolbox = "pt_br_accent_toolbox.cli.main:main"

[tool.setuptools.packages.find]
include = ["pt_br_accent_toolbox*"]

[tool.setuptools.package-data]
pt_br_accent_toolbox = ["data/annotations/*.csv", "data/annotations/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
